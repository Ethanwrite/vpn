name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xingsui-windows/**"
      - ".github/workflows/windows-client.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: xingsui-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: xingsui-windows/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify bundled core files
        shell: pwsh
        run: |
          if (!(Test-Path src-tauri\binaries\sing-box-x86_64-pc-windows-msvc.exe)) { throw "missing sing-box sidecar" }
          if (!(Test-Path src-tauri\resources\wintun.dll)) { throw "missing wintun.dll" }

      - name: Build Tauri bundles
        run: npm run tauri:build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: xingsui-windows-nsis
          path: xingsui-windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: xingsui-windows-msi
          path: xingsui-windows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
